<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="608" viewBox="0 0 1200 608" fill="none" role="img" aria-label="Technology stack. frontend: React, React Native, TypeScript, Next.js, Tailwind. backend: Node.js, Go, Python (FastAPI, Django), GraphQL. LLMs: Anthropic Claude, OpenAI, Claude Code. AI agents: agent design, multi-agent orchestration, RAG, prompt engineering. AI evals: evals, trigger evals, LLM observability. data: PostgreSQL, Redis, MongoDB, Elasticsearch, D3. cloud &amp; ci: AWS, GCP, Azure, Docker, GitHub Actions. testing: Cypress, Playwright, Maestro, TDD." aria-labelledby="title">
<title id="title">Technology stack. frontend: React, React Native, TypeScript, Next.js, Tailwind. backend: Node.js, Go, Python (FastAPI, Django), GraphQL. LLMs: Anthropic Claude, OpenAI, Claude Code. AI agents: agent design, multi-agent orchestration, RAG, prompt engineering. AI evals: evals, trigger evals, LLM observability. data: PostgreSQL, Redis, MongoDB, Elasticsearch, D3. cloud &amp; ci: AWS, GCP, Azure, Docker, GitHub Actions. testing: Cypress, Playwright, Maestro, TDD.</title>
<defs>
