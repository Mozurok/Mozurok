<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bruno Mazurok de Castro, Senior Full-Stack Engineer">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="0.5" stop-color="#6db3f2"/>
      <stop offset="1" stop-color="#b79df5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#262c2f" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#0b0d0e"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="600" cy="0" rx="620" ry="220" fill="#3ddc97" fill-opacity="0.06"/>

    <!-- terminal title bar -->
    <rect x="48" y="40" width="1104" height="240" rx="12" fill="#14181a" stroke="#262c2f" stroke-width="1"/>
    <circle cx="76" cy="66" r="6" fill="#ef8e7d"/>
    <circle cx="98" cy="66" r="6" fill="#e8b84a"/>
    <circle cx="120" cy="66" r="6" fill="#3ddc97"/>
    <text x="600" y="70" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#a3adb0">~/bruno-mazurok — zsh</text>
    <line x1="48" y1="88" x2="1152" y2="88" stroke="#262c2f" stroke-width="1"/>

    <!-- prompt -->
    <text x="80" y="132" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#3ddc97">$ <tspan fill="#a3adb0">whoami</tspan></text>

    <text x="80" y="182" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="40" font-weight="700" fill="#e8eae8">Bruno Mazurok de Castro</text>

    <text x="82" y="222" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="url(#accentGrad)">Senior Full-Stack Engineer</text>
    <!-- blinking cursor after the subtitle -->
    <rect x="408" y="206" width="12" height="20" fill="#3ddc97">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="80" y="258" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#a3adb0">14 yrs · ex-Coinbase Wallet · React Native · TypeScript · Node · Go</text>
  </g>
</svg>
