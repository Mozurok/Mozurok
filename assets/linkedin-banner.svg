<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" fill="none" role="img" aria-label="Building AI-powered workflows in production. Senior engineer, AI systems, scalable solutions." aria-labelledby="title">
<title id="title">Building AI-powered workflows in production. Senior engineer, AI systems, scalable solutions.</title>
<defs>
<style>@font-face{font-family:'IBM Plex Mono';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Schibsted Grotesk';font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}.m500{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:500;}.s800{font-family:'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:800;}text{font-kerning:normal;}</style>
<clipPath id="card"><rect width="1584" height="396" rx="0"/></clipPath>
<radialGradient id="glow" cx="0.08" cy="1.0" r="0.55">
<stop offset="0" stop-color="#006dfe" stop-opacity="0.24"/>
<stop offset="0.55" stop-color="#006dfe" stop-opacity="0.060"/>
<stop offset="1" stop-color="#006dfe" stop-opacity="0"/>
